<div class="min-h-screen bg-[#0a0a0a] flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Background glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#FF5C00]/10 rounded-full blur-[150px] pointer-events-none animate-pulse-slow"></div>

  <div class="w-full max-w-lg relative z-10 animate-fade-in-up">
    <div class="bg-[#121212]/80 rounded-[48px] border border-white/5 shadow-2xl p-12 backdrop-blur-xl">
      <div class="text-center mb-10">
        <h2 class="text-4xl font-black text-white uppercase tracking-tighter mb-3 font-outfit">ÚNETE AL <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#FF5C00] to-[#ff8c00]">LAB</span></h2>
        <p class="text-white/40 text-sm font-medium">Crea tu cuenta para acceder a lanzamientos exclusivos y drops limitados.</p>
      </div>

      <form class="space-y-6" (ngSubmit)="onRegister()">
        @if (errorMessage) {
          <div class="bg-red-500/10 border border-red-500/50 text-red-500 text-xs font-bold px-4 py-3 rounded-xl flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            {{ errorMessage }}
          </div>
        }

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2 group/input focus-within:text-[#FF5C00]">
            <label class="text-[10px] font-black text-white/30 group-focus-within/input:text-[#FF5C00] transition-colors uppercase tracking-widest ml-1">Nombre</label>
            <input
              class="w-full px-6 py-4 bg-[#1a1a1a] border border-white/5 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#FF5C00]/50 transition-all placeholder:text-white/10 hover:border-white/10"
              id="name"
              name="name"
              [(ngModel)]="name"
              type="text"
              placeholder="Nombre completo"
              [disabled]="isLoading"
            />
          </div>
          <div class="space-y-2 group/input focus-within:text-[#FF5C00]">
            <label class="text-[10px] font-black text-white/30 group-focus-within/input:text-[#FF5C00] transition-colors uppercase tracking-widest ml-1">Email</label>
            <input
              class="w-full px-6 py-4 bg-[#1a1a1a] border border-white/5 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#FF5C00]/50 transition-all placeholder:text-white/10 hover:border-white/10"
              id="email"
              name="email"
              [(ngModel)]="email"
              type="email"
              placeholder="tu@email.com"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <div class="space-y-2 group/input focus-within:text-[#FF5C00]">
          <label class="text-[10px] font-black text-white/30 group-focus-within/input:text-[#FF5C00] transition-colors uppercase tracking-widest ml-1">Contraseña</label>
          <input
            class="w-full px-6 py-4 bg-[#1a1a1a] border border-white/5 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#FF5C00]/50 transition-all placeholder:text-white/10 hover:border-white/10"
            id="password"
            name="password"
            [(ngModel)]="password"
            type="password"
            placeholder="••••••••"
            [disabled]="isLoading"
          />
        </div>

        <div class="space-y-2 group/input focus-within:text-[#FF5C00]">
          <label class="text-[10px] font-black text-white/30 group-focus-within/input:text-[#FF5C00] transition-colors uppercase tracking-widest ml-1">Confirmar Contraseña</label>
          <input
            class="w-full px-6 py-4 bg-[#1a1a1a] border border-white/5 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-[#FF5C00]/50 transition-all placeholder:text-white/10 hover:border-white/10"
            id="confirm-password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            type="password"
            placeholder="••••••••"
            [disabled]="isLoading"
          />
        </div>

        <div class="pt-6">
          <button
            class="w-full relative group overflow-hidden bg-white text-black font-black uppercase tracking-widest py-5 rounded-2xl transition-all duration-300 shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,92,0,0.3)] hover:-translate-y-1 active:translate-y-0 disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:shadow-none"
            type="submit"
            [disabled]="isLoading"
          >
            <span class="relative z-10 group-hover:text-white transition-colors duration-300 flex justify-center items-center gap-2">
              {{ isLoading ? 'Procesando...' : 'Registrarse ahora' }}
              @if (!isLoading) {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform">
                  <path d="M5 12h14m-7-7 7 7-7 7"/>
                </svg>
              }
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-[#FF5C00] to-[#e65200] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
          </button>
        </div>
      </form>

      <div class="mt-10 text-center border-t border-white/5 pt-8">
        <p class="text-[10px] text-white/30 font-black uppercase tracking-widest">
          ¿Ya eres miembro? <a routerLink="/login" class="text-[#FF5C00] hover:text-white transition-colors ml-2 relative group inline-block">Inicia sesión<span class="absolute -bottom-1 left-0 w-full h-[1px] bg-[#FF5C00] transition-all duration-300 group-hover:w-0"></span></a>
        </p>
      </div>
    </div>
    
    <div class="mt-8 text-center flex justify-center gap-8 opacity-30">
      <a href="#" class="text-[9px] font-black uppercase tracking-[0.2em] text-white hover:text-[#FF5C00] transition-colors">Privacidad</a>
      <a href="#" class="text-[9px] font-black uppercase tracking-[0.2em] text-white hover:text-[#FF5C00] transition-colors">Términos y Condiciones</a>
    </div>
  </div>
</div>
