<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#1a3a5f] rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">
      <h2 class="text-2xl font-bold text-white mb-2">Crear una cuenta</h2>
      <p class="text-gray-400 mb-6">¡Únete a LacedLab y empieza a comprar!</p>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1" for="name">Nombre</label>
          <input
            class="w-full px-4 py-2 bg-[#0D2944] border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#DA6719]"
            id="name"
            type="text"
            placeholder="Inserta tu nombre"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1" for="email">Correo electrónico</label>
          <input
            class="w-full px-4 py-2 bg-[#0D2944] border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#DA6719]"
            id="email"
            type="email"
            placeholder="Inserta tu correo electrónico"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1" for="password">Contraseña</label>
          <input
            class="w-full px-4 py-2 bg-[#0D2944] border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#DA6719]"
            id="password"
            type="password"
            placeholder="••••••••"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1" for="confirm-password">Confirmar contraseña</label>
          <input
            class="w-full px-4 py-2 bg-[#0D2944] border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-[#DA6719]"
            id="confirm-password"
            type="password"
            placeholder="••••••••"
          />
        </div>

        <button
          class="w-full bg-[#DA6719] hover:bg-[#c45a16] text-white font-bold py-2 px-4 rounded-lg transition-colors"
          type="submit"
        >
          Registrarse
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-400">
          ¿Ya tienes una cuenta? <a href="#" class="text-[#DA6719] hover:underline">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
